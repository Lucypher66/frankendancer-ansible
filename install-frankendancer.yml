---
- name: Frankendancer Installation
  hosts: localhost
  become: true
  become_user: root
  gather_facts: true

  tasks:
    - name: Update apt repositories
      ansible.builtin.apt:
        update_cache: yes

    - name: Install gcc
      ansible.builtin.apt:
        name: "gcc"
        state: present
    
    - name: Register gcc major version
      ansible.builtin.shell:
        cmd: "dpkg -l gcc | tail -n1 |cut -d ' ' -f15 | cut -d ':' -f2 |cut -d '-' -f1 | cut -d '.' -f1"
      register: gcc_major_version
      changed_when: false

    - name: __DEBUG__ Show only gcc_major_version stdout
      ansible.builtin.debug:
        msg: "{{ gcc_major_version.stdout }}"

    - name: Install rustup
      ansible.builtin.apt:
        name: "rustup"
        state: present
    
    - name: Set stable toolchain as default and run cargo for testing
      ansible.builtin.shell:
        cmd: |
          rustup default stable
          cargo
    
    - name: Register return value
      ansible.builtin.shell:
        cmd: echo $?
      register: cargo_status
      changed_when: false
    
    - name: __DEBUG__ Show only cargo_status stdout
      ansible.builtin.debug:
        msg: "{{ cargo_status.stdout }}"

    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Install clang
      ansible.builtin.apt:
        name: clang
        state: present

    - name: Install make
      ansible.builtin.apt:
        name: make
        state: present