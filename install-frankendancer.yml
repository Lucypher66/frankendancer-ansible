---
- name: Frankendancer Installation
  hosts: localhost
  become: true
  become_user: root
  gather_facts: true

  vars:
    frankendancer_repo_url: https://github.com/firedancer-io/firedancer.git
    frankendancer_version: v0.1006.40100
    frankendancer_src_dir: /opt/frankendancer
    frankendancer_config_path: "{{ frankendancer_src_dir }}/config.toml"
    frankendancer_fdctl_path: /bin/fdctl
    frankendancer_accounts_device: /dev/nvme0n1
    frankendancer_ledger_device: /dev/nvme1n1
    frankendancer_snapshots_device: /dev/nvme2n1
    frankendancer_accounts_mount_path: /mnt/accounts
    frankendancer_ledger_mount_path: /mnt/ledger
    frankendancer_snapshots_mount_path: /mnt/snapshots
    frankendancer_hugetlbfs_mount_path: /mnt/.fd
    frankendancer_hugetlbfs_max_page_size: gigantic
    frankendancer_hugetlbfs_gigantic_page_threshold_mib: 128
    frankendancer_home_dir: "/home/{{ frankendancer_run_user }}"
    frankendancer_run_user: frankendancer
    frankendancer_identity_path: "{{ frankendancer_home_dir }}/validator-keypair.json"
    frankendancer_layout_affinity: 1-58
    frankendancer_layout_agave_affinity: 56-63
    frankendancer_layout_blocklist_cores: 0h
    frankendancer_layout_agave_unified_scheduler_handler_threads: 4
    frankendancer_layout_net_tile_count: 1
    frankendancer_layout_quic_tile_count: 1
    frankendancer_layout_verify_tile_count: 40
    frankendancer_layout_bank_tile_count: 4
    frankendancer_layout_shred_tile_count: 1
    frankendancer_nginx_rpc_server_name: assigment-01.usetest.dev
    frankendancer_nginx_rpc_listen_port: 80
    frankendancer_nginx_rpc_tls_listen_port: 443
    frankendancer_certbot_email: ""
    frankendancer_certbot_webroot_path: /var/www/certbot
    frankendancer_certbot_reload_hook_path: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    frankendancer_letsencrypt_live_path: "/etc/letsencrypt/live/{{ frankendancer_nginx_rpc_server_name }}"
    frankendancer_letsencrypt_fullchain_path: "{{ frankendancer_letsencrypt_live_path }}/fullchain.pem"
    frankendancer_letsencrypt_privkey_path: "{{ frankendancer_letsencrypt_live_path }}/privkey.pem"
    frankendancer_gossip_port: 8001
    frankendancer_gui_enabled: true
    frankendancer_gui_listen_address: 127.0.0.1
    frankendancer_gui_listen_port: 8080
    frankendancer_rpc_port: 10101
    frankendancer_expected_genesis_hash: 5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d
    frankendancer_solana_metrics_config: "host=https://metrics.solana.com:8086,db=mainnet-beta,u=mainnet-beta_write,p=password"
    frankendancer_service_name: frankendancer.service
    frankendancer_gossip_entrypoints:
      - entrypoint.mainnet-beta.solana.com:8001
      - entrypoint2.mainnet-beta.solana.com:8001
      - entrypoint3.mainnet-beta.solana.com:8001
      - entrypoint4.mainnet-beta.solana.com:8001
      - entrypoint5.mainnet-beta.solana.com:8001
    frankendancer_known_validators:
      - 7Np41oeYqPefeNQEHSv1UDhYrehxin3NStELsSKCT4K2
      - GdnSyH3YtwcxFvQrVVJMm1JhTS4QVX7MFsX56uJLUfiZ
      - DE1bawNcRJB9rVm3buyMVfr8mBEoyyu73NBovf2oXJsJ
      - CakcnaRDHka2gXyfbEd2d3xsvkJkqsLw2akB3zsN1D2S

  tasks:
    - name: Update apt repositories
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes

    - name: Install nginx and certbot
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
        state: present
    
    - name: Ensure nginx is running and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Create certbot webroot directory
      ansible.builtin.file:
        path: "{{ frankendancer_certbot_webroot_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure bootstrap nginx reverse proxy for Frankendancer RPC
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/frankendancer-rpc
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen {{ frankendancer_nginx_rpc_listen_port }} default_server;
              listen [::]:{{ frankendancer_nginx_rpc_listen_port }} default_server;
              server_name {{ frankendancer_nginx_rpc_server_name }};

              location ^~ /.well-known/acme-challenge/ {
                  root {{ frankendancer_certbot_webroot_path }};
                  default_type text/plain;
              }

              location / {
                  proxy_pass http://127.0.0.1:{{ frankendancer_rpc_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }

    - name: Enable nginx reverse proxy site for Frankendancer RPC
      ansible.builtin.file:
        src: /etc/nginx/sites-available/frankendancer-rpc
        dest: /etc/nginx/sites-enabled/frankendancer-rpc
        state: link

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reload nginx after RPC proxy configuration
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Check whether Let's Encrypt certificate already exists
      ansible.builtin.stat:
        path: "{{ frankendancer_letsencrypt_fullchain_path }}"
      register: frankendancer_existing_certificate_stat

    - name: Request Let's Encrypt certificate with certbot using account email
      ansible.builtin.command:
        cmd: >-
          certbot certonly --webroot -w {{ frankendancer_certbot_webroot_path }}
          -d {{ frankendancer_nginx_rpc_server_name }}
          --email {{ frankendancer_certbot_email }}
          --agree-tos --non-interactive
      args:
        creates: "{{ frankendancer_letsencrypt_fullchain_path }}"
      when:
        - frankendancer_certbot_email | length > 0
        - not frankendancer_existing_certificate_stat.stat.exists

    - name: Request Let's Encrypt certificate with certbot without account email
      ansible.builtin.command:
        cmd: >-
          certbot certonly --webroot -w {{ frankendancer_certbot_webroot_path }}
          -d {{ frankendancer_nginx_rpc_server_name }}
          --register-unsafely-without-email
          --agree-tos --non-interactive
      args:
        creates: "{{ frankendancer_letsencrypt_fullchain_path }}"
      when:
        - frankendancer_certbot_email | length == 0
        - not frankendancer_existing_certificate_stat.stat.exists

    - name: Configure final nginx HTTPS reverse proxy for Frankendancer RPC
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/frankendancer-rpc
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen {{ frankendancer_nginx_rpc_listen_port }} default_server;
              listen [::]:{{ frankendancer_nginx_rpc_listen_port }} default_server;
              server_name {{ frankendancer_nginx_rpc_server_name }};

              location ^~ /.well-known/acme-challenge/ {
                  root {{ frankendancer_certbot_webroot_path }};
                  default_type text/plain;
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }

          server {
              listen {{ frankendancer_nginx_rpc_tls_listen_port }} ssl http2;
              listen [::]:{{ frankendancer_nginx_rpc_tls_listen_port }} ssl http2;
              server_name {{ frankendancer_nginx_rpc_server_name }};

              ssl_certificate {{ frankendancer_letsencrypt_fullchain_path }};
              ssl_certificate_key {{ frankendancer_letsencrypt_privkey_path }};
              ssl_session_cache shared:nginx_ssl_cache:10m;
              ssl_session_timeout 1d;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers off;

              location / {
                  proxy_pass http://127.0.0.1:{{ frankendancer_rpc_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }

    - name: Validate final nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reload nginx after installing TLS configuration
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Install certbot deploy hook to reload nginx after renewals
      ansible.builtin.copy:
        dest: "{{ frankendancer_certbot_reload_hook_path }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          systemctl reload nginx

    - name: Ensure certbot renewal timer is enabled and running
      ansible.builtin.systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Check whether Let's Encrypt certificate has been issued
      ansible.builtin.stat:
        path: "{{ frankendancer_letsencrypt_fullchain_path }}"
      register: frankendancer_letsencrypt_fullchain_stat

    - name: Verify certbot renewal path with dry run
      ansible.builtin.command:
        cmd: certbot renew --dry-run
      changed_when: false
      when: frankendancer_letsencrypt_fullchain_stat.stat.exists

    - name: Install gcc
      ansible.builtin.apt:
        name: "gcc"
        state: present
    
    - name: Register gcc major version
      ansible.builtin.shell:
        cmd: "dpkg -l gcc | tail -n1 |cut -d ' ' -f15 | cut -d ':' -f2 |cut -d '-' -f1 | cut -d '.' -f1"
      register: gcc_major_version
      changed_when: false

    - name: __DEBUG__ Show only gcc_major_version stdout
      ansible.builtin.debug:
        msg: "{{ gcc_major_version.stdout }}"

    - name: Install rustup
      ansible.builtin.apt:
        name: "rustup"
        state: present
    
    - name: Set stable toolchain as default and run cargo for testing
      ansible.builtin.shell:
        cmd: |
          rustup default stable
          cargo
    
    - name: Register return value
      ansible.builtin.shell:
        cmd: echo $?
      register: cargo_status
      changed_when: false
    
    - name: __DEBUG__ Show only cargo_status stdout
      ansible.builtin.debug:
        msg: "{{ cargo_status.stdout }}"

    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Install clang
      ansible.builtin.apt:
        name: clang
        state: present

    - name: Install make
      ansible.builtin.apt:
        name: make
        state: present

    - name: Install build-essential
      ansible.builtin.apt:
        name: build-essential
        state: present

    - name: Install pkgconf
      ansible.builtin.apt:
        name: pkgconf
        state: present

    - name: Install cmake
      ansible.builtin.apt:
        name: cmake
        state: present

    - name: Install libclang-dev
      ansible.builtin.apt:
        name: libclang-dev
        state: present

    - name: Install libudev-dev
      ansible.builtin.apt:
        name: libudev-dev
        state: present

    - name: Install protobuf-compiler
      ansible.builtin.apt:
        name: protobuf-compiler
        state: present

    - name: Clone Frankendancer repository with submodules
      ansible.builtin.git:
        repo: "{{ frankendancer_repo_url }}"
        dest: "{{ frankendancer_src_dir }}"
        version: "{{ frankendancer_version }}"
        recursive: true
        update: true

    - name: Install dependencies for frankendancer via deps.sh script
      ansible.builtin.shell:
        cmd: "bash {{ frankendancer_src_dir }}/deps.sh fetch check install"

    - name: Build fdctl and solana binaries
      ansible.builtin.command:
        cmd: /usr/bin/make fdctl solana
        chdir: "{{ frankendancer_src_dir }}"

    - name: Create symlink for fdctl
      ansible.builtin.file:
        src: "{{ frankendancer_src_dir }}/build/native/gcc/bin/fdctl"
        dest: "{{ frankendancer_fdctl_path }}"
        owner: root
        group: root
        state: link

    - name: Create symlink for solana
      ansible.builtin.file:
        src: "{{ frankendancer_src_dir }}/build/native/gcc/bin/solana"
        dest: /bin/solana
        owner: root
        group: root
        state: link

    - name: Remove irdma kernel module from running system
      ansible.builtin.shell:
        cmd: "rmmod irdma"

    - name: Create /etc/modprobe.d/no_irdma.conf
      ansible.builtin.file:
        path: /etc/modprobe.d/no_irdma.conf
        state: touch
        owner: root
        group: root

    - name: Blacklist irdma kernel module
      ansible.builtin.blockinfile:
        path: /etc/modprobe.d/no_irdma.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK: blacklist irdma"
        block: |
          blacklist irdma

    - name: Ensure Frankendancer run user exists
      ansible.builtin.user:
        name: "{{ frankendancer_run_user }}"
        home: "{{ frankendancer_home_dir }}"
        create_home: true
        shell: /usr/sbin/nologin
        system: true

    - name: Create Frankendancer config.toml and fill with content
      ansible.builtin.blockinfile:
        path: "{{ frankendancer_config_path }}"
        create: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK: Frankendancer config"
        block: |
          user = "{{ frankendancer_run_user }}"

          [hugetlbfs]
          mount_path = "{{ frankendancer_hugetlbfs_mount_path }}"
          max_page_size = "{{ frankendancer_hugetlbfs_max_page_size }}"
          gigantic_page_threshold_mib = {{ frankendancer_hugetlbfs_gigantic_page_threshold_mib }}

          [layout]
          affinity = "{{ frankendancer_layout_affinity }}"
          agave_affinity = "{{ frankendancer_layout_agave_affinity }}"
          blocklist_cores = "{{ frankendancer_layout_blocklist_cores }}"
          agave_unified_scheduler_handler_threads = {{ frankendancer_layout_agave_unified_scheduler_handler_threads }}
          net_tile_count = {{ frankendancer_layout_net_tile_count }}
          quic_tile_count = {{ frankendancer_layout_quic_tile_count }}
          verify_tile_count = {{ frankendancer_layout_verify_tile_count }}
          bank_tile_count = {{ frankendancer_layout_bank_tile_count }}
          shred_tile_count = {{ frankendancer_layout_shred_tile_count }}

          [gossip]
          entrypoints = [
          {% for entrypoint in frankendancer_gossip_entrypoints %}
            "{{ entrypoint }}",
          {% endfor %}
          ]
          port = {{ frankendancer_gossip_port }}

          [ledger]
          path = "{{ frankendancer_ledger_mount_path }}"
          accounts_path = "{{ frankendancer_accounts_mount_path }}"

          [snapshots]
          path = "{{ frankendancer_snapshots_mount_path }}"

          [rpc]
          port = {{ frankendancer_rpc_port }}
          full_api = true
          private = true
          bind_address = "127.0.0.1"

          [tiles.gui]
          enabled = {{ frankendancer_gui_enabled | lower }}
          gui_listen_address = "{{ frankendancer_gui_listen_address }}"
          gui_listen_port = {{ frankendancer_gui_listen_port }}

          [reporting]
          solana_metrics_config = "{{ frankendancer_solana_metrics_config }}"

          [consensus]
          identity_path = "{{ frankendancer_identity_path }}"
          snapshot_fetch = true
          genesis_fetch = true
          expected_genesis_hash = "{{ frankendancer_expected_genesis_hash }}"
          known_validators = [
          {% for validator in frankendancer_known_validators %}
            "{{ validator }}",
          {% endfor %}
          ]

    - name: Create Frankendancer identity keypair when missing
      ansible.builtin.command:
        cmd: "{{ frankendancer_fdctl_path }} keys new {{ frankendancer_identity_path }} --config {{ frankendancer_config_path }}"
        creates: "{{ frankendancer_identity_path }}"

    - name: Inspect accounts disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_accounts_device }}"
      register: frankendancer_accounts_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on accounts disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_accounts_device }}
      when: >
        frankendancer_accounts_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_accounts_disk_layout.stdout or
        ('"node":"' ~ frankendancer_accounts_device ~ 'p1"') not in frankendancer_accounts_disk_layout.stdout

    - name: Create ledger mountpoint
      ansible.builtin.file:
        path: "{{ frankendancer_ledger_mount_path }}"
        state: directory
        owner: root
        group: root

    - name: Create accounts mountpoint
      ansible.builtin.file:
        path: "{{ frankendancer_accounts_mount_path }}"
        state: directory
        owner: root
        group: root

    - name: Create snapshots mountpoint
      ansible.builtin.file:
        path: "{{ frankendancer_snapshots_mount_path }}"
        state: directory
        owner: root
        group: root

    - name: Inspect ledger disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_ledger_device }}"
      register: frankendancer_ledger_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on ledger disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_ledger_device }}
      when: >
        frankendancer_ledger_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_ledger_disk_layout.stdout or
        ('"node":"' ~ frankendancer_ledger_device ~ 'p1"') not in frankendancer_ledger_disk_layout.stdout

    - name: Inspect snapshots disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_snapshots_device }}"
      register: frankendancer_snapshots_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on snapshots disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_snapshots_device }}
      when: >
        frankendancer_snapshots_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_snapshots_disk_layout.stdout or
        ('"node":"' ~ frankendancer_snapshots_device ~ 'p1"') not in frankendancer_snapshots_disk_layout.stdout

    - name: Mount accounts partition
      block:
        - name: Check accounts first partition exists
          ansible.builtin.stat:
            path: "{{ frankendancer_accounts_device }}p1"
          register: frankendancer_accounts_partition

        - name: Ensure accounts first partition is available
          ansible.builtin.assert:
            that:
              - frankendancer_accounts_partition.stat.exists
              - frankendancer_accounts_partition.stat.isblk
            fail_msg: "Accounts partition {{ frankendancer_accounts_device }}p1 does not exist or is not a block device."

        - name: Ensure ext4 filesystem on accounts first partition
          ansible.builtin.filesystem:
            fstype: ext4
            dev: "{{ frankendancer_accounts_device }}p1"

        - name: Mount accounts first partition
          ansible.builtin.mount:
            path: "{{ frankendancer_accounts_mount_path }}"
            src: "{{ frankendancer_accounts_device }}p1"
            fstype: ext4
            opts: defaults
            boot: true
            dump: "0"
            passno: "2"
            state: mounted

    - name: Mount ledger partition
      block:
        - name: Check ledger first partition exists
          ansible.builtin.stat:
            path: "{{ frankendancer_ledger_device }}p1"
          register: frankendancer_ledger_partition

        - name: Ensure ledger first partition is available
          ansible.builtin.assert:
            that:
              - frankendancer_ledger_partition.stat.exists
              - frankendancer_ledger_partition.stat.isblk
            fail_msg: "Ledger partition {{ frankendancer_ledger_device }}p1 does not exist or is not a block device."

        - name: Ensure ext4 filesystem on ledger first partition
          ansible.builtin.filesystem:
            fstype: ext4
            dev: "{{ frankendancer_ledger_device }}p1"

        - name: Mount ledger first partition
          ansible.builtin.mount:
            path: "{{ frankendancer_ledger_mount_path }}"
            src: "{{ frankendancer_ledger_device }}p1"
            fstype: ext4
            opts: defaults
            boot: true
            dump: "0"
            passno: "2"
            state: mounted

    - name: Mount snapshots partition
      block:
        - name: Check snapshots first partition exists
          ansible.builtin.stat:
            path: "{{ frankendancer_snapshots_device }}p1"
          register: frankendancer_snapshots_partition

        - name: Ensure snapshots first partition is available
          ansible.builtin.assert:
            that:
              - frankendancer_snapshots_partition.stat.exists
              - frankendancer_snapshots_partition.stat.isblk
            fail_msg: "Snapshots partition {{ frankendancer_snapshots_device }}p1 does not exist or is not a block device."

        - name: Ensure ext4 filesystem on snapshots first partition
          ansible.builtin.filesystem:
            fstype: ext4
            dev: "{{ frankendancer_snapshots_device }}p1"

        - name: Mount snapshots first partition
          ansible.builtin.mount:
            path: "{{ frankendancer_snapshots_mount_path }}"
            src: "{{ frankendancer_snapshots_device }}p1"
            fstype: ext4
            opts: defaults
            boot: true
            dump: "0"
            passno: "2"
            state: mounted

    - name: Ensure Firedancer data mountpoints are writable by runtime user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ frankendancer_run_user }}"
        group: "{{ frankendancer_run_user }}"
        mode: "0755"
        recurse: true
      loop:
        - "{{ frankendancer_accounts_mount_path }}"
        - "{{ frankendancer_ledger_mount_path }}"
        - "{{ frankendancer_snapshots_mount_path }}"

    - name: Initialize Frankendancer
      ansible.builtin.shell:
        cmd: "{{ frankendancer_fdctl_path }} configure init all --config {{ frankendancer_config_path }}"

    - name: Install Frankendancer systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ frankendancer_service_name }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Frankendancer full node and RPC service
          Wants=network-online.target
          After=network-online.target local-fs.target
          RequiresMountsFor={{ frankendancer_accounts_mount_path }} {{ frankendancer_ledger_mount_path }} {{ frankendancer_snapshots_mount_path }}
          ConditionPathExists={{ frankendancer_config_path }}
          ConditionPathExists={{ frankendancer_identity_path }}

          [Service]
          Type=simple
          ExecStartPre={{ frankendancer_fdctl_path }} configure init all --config {{ frankendancer_config_path }}
          ExecStart={{ frankendancer_fdctl_path }} run --config {{ frankendancer_config_path }}
          Restart=on-failure
          RestartSec=10
          LimitMEMLOCK=infinity
          LimitNOFILE=1024000
          TimeoutStopSec=120
          KillMode=control-group

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Frankendancer systemd service
      ansible.builtin.systemd:
        name: "{{ frankendancer_service_name }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for Frankendancer systemd service to become active
      ansible.builtin.command:
        cmd: "systemctl is-active {{ frankendancer_service_name }}"
      register: frankendancer_service_status
      changed_when: false
      retries: 12
      delay: 10
      until: frankendancer_service_status.stdout == "active"

    - name: Verify Frankendancer responds to fdctl metrics
      ansible.builtin.command:
        cmd: "{{ frankendancer_fdctl_path }} metrics --config {{ frankendancer_config_path }}"
      register: frankendancer_metrics
      changed_when: false
      retries: 6
      delay: 10
      until: frankendancer_metrics.rc == 0 and 'tile_pid' in frankendancer_metrics.stdout

