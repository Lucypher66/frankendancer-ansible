---
- name: Frankendancer Installation
  hosts: localhost
  become: true
  become_user: root
  gather_facts: true

  vars:
    frankendancer_repo_url: https://github.com/firedancer-io/firedancer.git
    frankendancer_version: v0.1006.40100
    frankendancer_src_dir: /opt/frankendancer
    frankendancer_accounts_device: /dev/nvme0n1
    frankendancer_ledger_device: /dev/nvme1n1
    frankendancer_snapshots_device: /dev/nvme2n1

  tasks:
    - name: Update apt repositories
      ansible.builtin.apt:
        update_cache: yes

    - name: Install gcc
      ansible.builtin.apt:
        name: "gcc"
        state: present
    
    - name: Register gcc major version
      ansible.builtin.shell:
        cmd: "dpkg -l gcc | tail -n1 |cut -d ' ' -f15 | cut -d ':' -f2 |cut -d '-' -f1 | cut -d '.' -f1"
      register: gcc_major_version
      changed_when: false

    - name: __DEBUG__ Show only gcc_major_version stdout
      ansible.builtin.debug:
        msg: "{{ gcc_major_version.stdout }}"

    - name: Install rustup
      ansible.builtin.apt:
        name: "rustup"
        state: present
    
    - name: Set stable toolchain as default and run cargo for testing
      ansible.builtin.shell:
        cmd: |
          rustup default stable
          cargo
    
    - name: Register return value
      ansible.builtin.shell:
        cmd: echo $?
      register: cargo_status
      changed_when: false
    
    - name: __DEBUG__ Show only cargo_status stdout
      ansible.builtin.debug:
        msg: "{{ cargo_status.stdout }}"

    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Install clang
      ansible.builtin.apt:
        name: clang
        state: present

    - name: Install make
      ansible.builtin.apt:
        name: make
        state: present

    - name: Install build-essential
      ansible.builtin.apt:
        name: build-essential
        state: present

    - name: Install pkgconf
      ansible.builtin.apt:
        name: pkgconf
        state: present

    - name: Install cmake
      ansible.builtin.apt:
        name: cmake
        state: present

    - name: Install libclang-dev
      ansible.builtin.apt:
        name: libclang-dev
        state: present

    - name: Install libudev-dev
      ansible.builtin.apt:
        name: libudev-dev
        state: present

    - name: Install protobuf-compiler
      ansible.builtin.apt:
        name: protobuf-compiler
        state: present

    - name: Clone Frankendancer repository with submodules
      ansible.builtin.git:
        repo: "{{ frankendancer_repo_url }}"
        dest: "{{ frankendancer_src_dir }}"
        version: "{{ frankendancer_version }}"
        recursive: true
        update: true

    - name: Inspect accounts disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_accounts_device }}"
      register: frankendancer_accounts_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on accounts disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_accounts_device }}
      when: >
        frankendancer_accounts_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_accounts_disk_layout.stdout or
        ('"node":"' ~ frankendancer_accounts_device ~ 'p1"') not in frankendancer_accounts_disk_layout.stdout

    - name: Inspect ledger disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_ledger_device }}"
      register: frankendancer_ledger_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on ledger disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_ledger_device }}
      when: >
        frankendancer_ledger_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_ledger_disk_layout.stdout or
        ('"node":"' ~ frankendancer_ledger_device ~ 'p1"') not in frankendancer_ledger_disk_layout.stdout

    - name: Inspect snapshots disk layout
      ansible.builtin.command:
        cmd: "sfdisk --json {{ frankendancer_snapshots_device }}"
      register: frankendancer_snapshots_disk_layout
      changed_when: false
      failed_when: false

    - name: Create GPT label and single Linux partition on snapshots disk
      ansible.builtin.shell:
        cmd: |
          printf 'label: gpt\n, , linux\n' | sfdisk --force --wipe always {{ frankendancer_snapshots_device }}
      when: >
        frankendancer_snapshots_disk_layout.rc != 0 or
        '"label":"gpt"' not in frankendancer_snapshots_disk_layout.stdout or
        ('"node":"' ~ frankendancer_snapshots_device ~ 'p1"') not in frankendancer_snapshots_disk_layout.stdout

        