---
- name: Frankendancer Installation
  hosts: localhost
  become: true
  become_user: root
  gather_facts: true

  tasks:
    - name: Install rustup
      ansible.builtin.apt:
        name: "rustup"
        state: present
    - name: Set stable toolchain as default
      ansible.builtin.shell:
        cmd: "rustup default stable"
    - name: Check if cargo works
      ansible.builtin.shell:
        cmd: "echo $?"
        register: cargo_status
    - name: __DEBUG__ Check cargo variable value
      ansible.builtin.debug:
        msg: "{{ cargo_status }}"